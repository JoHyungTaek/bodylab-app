<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>비밀번호 재설정 — 바디랩</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="tape-rule"></div>

<div class="wrap">
  <header class="hero">
    <div>
      <div class="eyebrow">바디랩</div>
      <h1>비밀번호<br><span>재설정</span></h1>
    </div>
  </header>

  <section>
    <div class="auth-box">
      <h2>새 비밀번호 설정</h2>
      <p id="resetSub">이메일 링크로 들어오셨다면 아래에 새 비밀번호를 입력해 주세요.</p>

      <div class="auth-field">
        <label for="newPassword">새 비밀번호</label>
        <input type="password" id="newPassword" placeholder="6자 이상" autocomplete="new-password">
      </div>

      <button class="btn" id="resetSubmitBtn" style="width:100%;">비밀번호 변경</button>
      <div class="auth-error" id="resetError"></div>
      <div class="auth-switch">
        <a href="index.html">로그인 화면으로 돌아가기</a>
      </div>
    </div>
  </section>

  <footer class="wrap">
    이 링크는 이메일로 받은 비밀번호 재설정 링크를 통해서만 정상 작동해요. 링크가 만료됐다면 로그인 화면에서 다시 요청해 주세요.
  </footer>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="config.js"></script>
<script type="module">
  const sb = window.supabase.createClient(window.APP_CONFIG.SUPABASE_URL, window.APP_CONFIG.SUPABASE_ANON_KEY);
  const btn = document.getElementById('resetSubmitBtn');
  const errBox = document.getElementById('resetError');
  const input = document.getElementById('newPassword');
  const sub = document.getElementById('resetSub');

  // 이메일 링크로 들어오면 supabase-js가 URL의 토큰을 자동으로 세션으로 교환해요.
  sb.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') {
      sub.textContent = '본인 확인이 완료됐어요. 새 비밀번호를 입력해 주세요.';
    }
  });

  btn.addEventListener('click', async () => {
    const password = input.value;
    errBox.style.display = 'none';
    if (!password || password.length < 6) {
      errBox.style.color = 'var(--signal)';
      errBox.textContent = '비밀번호는 6자 이상이어야 해요.';
      errBox.style.display = 'block';
      return;
    }
    btn.disabled = true;
    const { error } = await sb.auth.updateUser({ password });
    if (error) {
      errBox.style.color = 'var(--signal)';
      errBox.textContent = error.message || '비밀번호 변경에 실패했어요. 링크가 만료됐을 수 있어요.';
      errBox.style.display = 'block';
      btn.disabled = false;
      return;
    }
    errBox.style.color = 'var(--good)';
    errBox.textContent = '변경됐어요! 로그인 화면으로 이동할게요…';
    errBox.style.display = 'block';
    setTimeout(() => { location.href = 'index.html'; }, 1500);
  });
</script>
</body>
</html>
